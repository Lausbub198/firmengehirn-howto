<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Firmengehirn (Zeichen ohne Kachel)">
  <!-- Firmengehirn-Logo: Farben aus stil.js der Erklär-Serie (Navy, Mathe-Türkis, Sprachmodell-Pink, Frage-Blau). Kein Gelb. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3D8C"/>
      <stop offset="1" stop-color="#24255E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3FC1D9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FC1D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#3FC1D9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- linke Hälfte -->
    <path d="M124 62 C 104 50, 78 56, 72 76 C 52 80, 46 104, 58 118 C 44 132, 52 158, 72 162 C 76 184, 102 196, 124 184 Z"/>
    <!-- rechte Hälfte -->
    <path d="M132 62 C 152 50, 178 56, 184 76 C 204 80, 210 104, 198 118 C 212 132, 204 158, 184 162 C 180 184, 154 196, 132 184 Z"/>
  </g>
  <!-- Leiterbahnen -->
  <g fill="none" stroke="#3FC1D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M124 92 H 100 L 88 104"/>
    <path d="M124 124 H 92 L 80 136"/>
    <path d="M124 156 H 104 L 96 164"/>
    <path d="M132 92 H 156 L 168 104"/>
    <path d="M132 124 H 164"/>
    <path d="M132 156 H 152 L 164 146"/>
  </g>
  <!-- Knoten -->
  <g fill="#24255E" stroke="#3FC1D9" stroke-width="4">
    <circle cx="88" cy="104" r="7"/>
    <circle cx="80" cy="136" r="7"/>
    <circle cx="96" cy="164" r="7"/>
    <circle cx="168" cy="104" r="7"/>
    <circle cx="164" cy="146" r="7"/>
  </g>
  <!-- Sprachmodell (schreibt): Pink -->
  <circle cx="172" cy="124" r="11" fill="#FF7AC6" filter="url(#soft)"/>
  <!-- Frage: Blau, Funke oben -->
  <path d="M128 30 l 6 14 l 14 6 l -14 6 l -6 14 l -6 -14 l -14 -6 l 14 -6 z" fill="#8FA0FF" filter="url(#soft)"/>
</svg>
